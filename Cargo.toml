# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
authors = ["João Loureiro", "Hristo Hristov <maintainer@ccvs.tech>"]
name = "quick-serve-enterprise"
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/hah23255/quick-serve-enterprise"
homepage = "https://www.ccvs.tech"
description = "Quick Serve Enterprise: Production-hardened fork with Android/Termux optimizations, critical bug fixes, custom error pages, and comprehensive operational documentation"
categories = ["command-line-utilities", "development-tools", "web-programming::http-server"]
keywords = ["http-server", "ftp", "tftp", "file-server", "android"]

[features]
ui = ["dep:egui", "dep:eframe", "dep:rfd"]
default = ["ui"]

[[bin]]
name = "quick-serve-gui"
path = "src/main_gui.rs"
required-features = ["ui"]

[[bin]]
name = "quick-serve"
path = "src/main_cli.rs"

[dependencies]
# TODO: Put only the used features
tokio = { version = "^1.42", features = ["full"]}
async-trait = "^0.1"

# FTP server deps
libunftp = "^0.21"
unftp-sbe-fs = "^0.3"

# TFTP server
async-tftp = "^0.3"

# HTTP server deps: TODO: check whats needed
hyper = { version = "^1.8", features = ["full"] }
http-body-util = "^0.1"
hyper-util = { version = "^0.1", features = ["full"] }
bytes = "^1.9"

# DHCP server deps
dhcp4r = "^0.2"

# Log related
log = "^0.4"

# For the headless version
clap = { version = "^4.5", features = ["derive", "string"] }
ctrlc = "^3.5"
sha2 = "^0.10"

# For the gui version
egui = {version = "^0.33", optional = true}
eframe = {version = "^0.32", features = ["wayland"], optional = true}
rfd = {version = "^0.15", optional = true}

[dev-dependencies]

testcontainers = { version = "^0.24" }
testcontainers-modules = { version = "^0.12", features = ["blocking"] }

sha2 = "^0.10"
tempfile = "^3.15"
rand = "^0.9"
assert_cmd = "^2.0"
predicates = "^3.1"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true # Link time optimizations
panic = "abort" # Saves binary size on removing backtrace data on panic

